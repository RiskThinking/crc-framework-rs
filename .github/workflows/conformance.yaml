name: Package conformance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Format, clippy and mypy
        run: |
          python tools/api_contracts/check.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pip install numpy mypy jsonschema types-jsonschema
          python -m mypy
      - name: Check the declared minimum Rust version
        run: |
          rust_version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          cargo +"$rust_version" check --workspace --all-targets --locked
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify generated contracts and build the Python wheel
        run: |
          pip install maturin numpy pytest jsonschema rfc3339-validator
          maturin build --release --locked --out "$RUNNER_TEMP/contract-wheel"
          pip install "$RUNNER_TEMP"/contract-wheel/*.whl
          python tools/impact_contracts/generate.py --check
          python tools/numerical_contracts/generate.py --check
          python tools/numerical_contracts/fixtures.py --check
          python tools/scientific_contracts/generate.py --check
      - uses: ./.github/actions/check-wheel
        with:
          python-versions: "3.12"
          wheel-directory: ${{ runner.temp }}/contract-wheel
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Consume canonical artifact in the native core
        run: |
          cargo test -p crc-framework-core --test canonical_consumer --test dataset_contract --test impact_contract_canonical --test impact_definition_conformance --test impact_registry_conformance --locked
          cargo test -p crc-framework-core --no-default-features --test canonical_consumer --test dataset_contract --test impact_contract_canonical --test impact_definition_conformance --test impact_registry_conformance --locked
  build:
    # Independent of the other jobs; running it alongside them keeps the
    # slowest job (WASM optimization and browser tests) off the critical path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test the native workspace
        run: cargo test --workspace --locked
      - name: Install WASM build tooling
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build and test package
        working-directory: js
        run: |
          npm ci
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run benchmark
          npm run test:consumer
      - name: Verify build leaves version sources unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock crates/core/Cargo.toml crates/wasm/Cargo.toml js/package.json js/package-lock.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js/dist/*.tgz
