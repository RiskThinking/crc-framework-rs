name: JavaScript WASM
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request supersedes its running checks. Branch and tag
  # runs get a group of their own, so they are never queued or cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  conformance:
    uses: ./.github/workflows/conformance.yaml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: conformance
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifact
      - name: Publish tested tarball using npm OIDC
        run: node js/publish.mjs artifact
