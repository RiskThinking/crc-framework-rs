name: JavaScript WASM
on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Format, clippy and mypy
        run: |
          python tools/api_contracts/check.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          pip install numpy mypy jsonschema types-jsonschema
          python -m mypy
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify generated contracts and Python consumers
        run: |
          pip install maturin numpy pytest jsonschema rfc3339-validator
          maturin build --release --locked --out /tmp/contract-wheel
          pip install /tmp/contract-wheel/*.whl
          python tools/impact_contracts/generate.py --check
          python tools/numerical_contracts/generate.py --check
          python tools/numerical_contracts/fixtures.py --check
          python tools/scientific_contracts/generate.py --check
          cd /tmp
          python -m pytest -q "$GITHUB_WORKSPACE/tests/test_shared_contracts.py" "$GITHUB_WORKSPACE/tests/test_measurements.py" "$GITHUB_WORKSPACE/tests/test_fitting_serialization.py"
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Consume canonical artifact in the native core
        run: |
          cargo test -p crc-framework-core --test canonical_consumer --test dataset_contract --test impact_contract_canonical --test impact_definition_conformance --test impact_registry_conformance --locked
          cargo test -p crc-framework-core --no-default-features --test canonical_consumer --test dataset_contract --test impact_contract_canonical --test impact_definition_conformance --test impact_registry_conformance --locked
  build:
    needs: [python-contracts, native-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test native core and Python parity
        run: |
          cargo test -p crc-framework-core --locked
          cargo test -p crc-framework-core --no-default-features --lib --test canonical_consumer --locked
          pip install maturin pytest numpy jsonschema rfc3339-validator
          python tools/impact_contracts/generate.py --check
          maturin build --release --locked --out /tmp/crc-wheels
          pip install /tmp/crc-wheels/*.whl
          python -m pytest -q
      - name: Install WASM build tooling
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build and test package
        working-directory: js
        run: |
          npm ci
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run benchmark
          npm run test:consumer
      - name: Verify build leaves version sources unchanged
        run: git diff --exit-code -- Cargo.toml Cargo.lock crates/core/Cargo.toml crates/wasm/Cargo.toml js/package.json js/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: js/dist/*.tgz
  runtime-contract:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install isolated Python wheel
        run: |
          uv build --wheel --python 3.12 --out-dir "$RUNNER_TEMP/contract-wheel"
          uv venv --python 3.12 "$RUNNER_TEMP/contract-venv"
          uv pip install --python "$RUNNER_TEMP/contract-venv/bin/python" "$RUNNER_TEMP"/contract-wheel/*.whl
      - name: Verify installed runtime before npm publication
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/contract-venv/bin/python" -I "$GITHUB_WORKSPACE/tools/api_contracts/check.py" --runtime'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, runtime-contract]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: js/.nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifact
      - name: Publish tested tarball using npm OIDC
        run: node js/publish.mjs artifact
