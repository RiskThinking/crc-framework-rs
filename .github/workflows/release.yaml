name: Package release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
jobs:

  release-contract:
    name: Release declarations and Git tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Validate release tag and declared contract
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.12 python tools/api_contracts/check.py
          uv run --no-project --python 3.12 python -c 'import os, tomllib; version=tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]; assert os.environ["RELEASE_REF_TYPE"] == "tag" and os.environ["RELEASE_REF_NAME"] == "v" + version, "Release must run from the matching version tag"'

  conformance:
    needs: release-contract
    uses: ./.github/workflows/conformance.yaml

  linux:
    needs: release-contract
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --locked
            --out dist
            --compatibility manylinux_2_28
            --interpreter python3.11 python3.12 python3.13 python3.14 python3.14t
          sccache: "true"
          manylinux: auto
          container: "2_28"
      - uses: ./.github/actions/check-wheel
        with:
          python-versions: 3.11 3.12 3.13 3.14 3.14t
          wheel-directory: dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: release-contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The free-threaded build gets its own job: once setup-python installs
        # 3.14t next to 3.14, `python3.14` resolves to the free-threaded
        # interpreter and no regular 3.14 wheel is built (see the Windows job).
        os: [macos-15-intel, macos-15]
        build: [regular, free-threaded]
        include:
          - {os: macos-15-intel, target: x86_64}
          - {os: macos-15, target: aarch64}
          - build: regular
            python: "3.11 3.12 3.13 3.14"
          - build: free-threaded
            python: "3.14t"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.build }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Select interpreters
        id: interpreters
        env:
          PYTHON_VERSIONS: ${{ matrix.python }}
        run: |
          {
            echo "versions<<EOF"
            tr ' ' '\n' <<< "$PYTHON_VERSIONS"
            echo "EOF"
            echo "names=$(printf 'python%s ' $PYTHON_VERSIONS)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.interpreters.outputs.versions }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --locked
            --out dist
            --interpreter ${{ steps.interpreters.outputs.names }}
          sccache: "true"
          container: "off"
      - uses: ./.github/actions/check-wheel
        with:
          python-versions: ${{ matrix.python }}
          wheel-directory: dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-mac-${{ matrix.target }}-${{ matrix.build }}
          path: dist

  windows:
    needs: release-contract
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        # 3.14 and 3.14t are separate jobs. setup-python cannot co-install the
        # regular and free-threaded builds of one minor version on Windows
        # (python/cpython#127294, PyO3/maturin-action#313).
        interpreter: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - name: Enable long paths
        run: |
          reg add HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-${{ matrix.interpreter }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.interpreter }}
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          target: x64
          args: >-
            --release
            --locked
            --out dist
            --interpreter ${{ steps.setup-python.outputs.python-path }}
          sccache: "true"
          container: "off"
      - uses: ./.github/actions/check-wheel
        with:
          python-versions: ${{ matrix.interpreter }}
          wheel-directory: dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64-${{ matrix.interpreter }}
          path: dist

  sdist:
    needs: release-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build a wheel from the source distribution
        run: uv build --wheel --python 3.12 --out-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
      - uses: ./.github/actions/check-wheel
        with:
          python-versions: "3.12"
          wheel-directory: ${{ runner.temp }}/sdist-wheel
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-dist
          path: dist

  deploy:
    name: Release
    environment: production
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, conformance]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.download.outputs.download-path }}/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
