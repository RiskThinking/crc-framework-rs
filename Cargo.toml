[package]
name = "crc-framework-rs"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Rust-powered Python bindings for the Climate Risk Commons Framework"
authors = ["Riskthinking.AI"]
license = "AGPL-3.0-or-later"
readme = "README.md"

[workspace]
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "1.0.0-alpha.2"
rust-version = "1.87"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
crc-framework-core = { path = "crates/core" }
h3o = "=0.9.3"
pyo3 = { version = "0.29", features = ["extension-module"] }
