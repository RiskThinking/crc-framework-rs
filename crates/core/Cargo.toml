[package]
name = "crc-framework-core"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Core distribution and climate-risk algorithms for CRC Framework"
authors = ["Riskthinking.AI"]
license = "AGPL-3.0-or-later"

[features]
default = ["sampling"]
sampling = ["dep:rand"]

[dependencies]
h3o = "=0.9.3"
phf = { version = "0.14.0", features = ["macros"] }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
h3o = "=0.9.3"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
