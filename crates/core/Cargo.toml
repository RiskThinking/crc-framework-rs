[package]
name = "crc-framework-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Core distribution and climate-risk algorithms for CRC Framework"
authors = ["Riskthinking.AI"]
license = "AGPL-3.0-or-later"

[features]
default = ["sampling"]
sampling = ["dep:nalgebra", "dep:rand", "dep:rand_chacha", "dep:rand_distr"]

[dependencies]
geo = { version = "0.32.0", default-features = false }
h3o = "=0.9.3"
jsonschema = { version = "0.61.2", default-features = false, features = ["arbitrary-precision"] }
nalgebra = { version = "=0.33.2", default-features = false, features = ["std"], optional = true }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
phf = { version = "0.14.0", features = ["macros"] }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "=0.9.0", optional = true }
rand_distr = { version = "=0.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"

[dev-dependencies]
h3o = "=0.9.3"
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "arbitrary_precision"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
