[package]
name = "crc-framework-wasm"
version = "0.4.0-alpha.2"
edition = "2024"
rust-version = "1.85"
description = "Official JavaScript/WebAssembly bindings for CRC Framework canonical curves"
license = "AGPL-3.0-or-later"
repository = "https://github.com/RiskThinking/crc-framework-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc-framework-core = { path = "../core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
