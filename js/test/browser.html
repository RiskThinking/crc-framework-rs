<!doctype html>
<meta charset="utf-8">
<title>CRC numerical contract conformance</title>
<pre id="result">Loading WASM…</pre>
<script type="module">
import init, {quantile,prepareNumerical,prepareNumericals} from '../src/index.js';
try {
 const start=performance.now();
 await Promise.all([init(),init()]);
 const initMs=performance.now()-start;
 const cases=await (await fetch('../../python/crc_framework/contracts/numerical/fixtures-1.0.json')).json();
 let assertions=0;
 for(const fixture of cases.accepted) {
  const text=JSON.stringify(fixture.document),prepared=prepareNumerical(text);
  try {
   for(const query of fixture.queries) {
    if(query.outcome==='out_of_support') {
     let rejected=false;try {prepared.quantile(query.probability);} catch {rejected=true;}
     if(!rejected) throw new Error('outside evidence was accepted');
     assertions++;continue;
    }
    const expected=query.outcome==='positive_infinity'?Infinity:query.outcome==='negative_infinity'?-Infinity:query.value;
    for(const actual of [quantile(text,query.probability),prepared.quantile(query.probability)]) {
     const matches = Number.isFinite(expected)
       ? Math.abs(actual - expected) <= 2e-10 * Math.max(1, Math.abs(expected))
       : actual === expected;
     if (!matches) throw new Error(`${fixture.name}: ${actual} != ${expected}`);
     assertions++;
    }
   }
  } finally {prepared.free();}
 }
 const documents=cases.accepted.filter(c=>c.document.object==='distribution').map(c=>c.document);
 const batch=prepareNumericals(JSON.stringify(documents));
 try {
  const values=batch.quantile(.99);
  documents.forEach((doc,index)=>{if(values[index]!==quantile(JSON.stringify(doc),.99)) throw new Error('batch mismatch');assertions++;});
 } finally {batch.free();}
 window.testResult={status:'passed',assertions,initMs};
 document.querySelector('#result').textContent=JSON.stringify(window.testResult);
} catch(error) {window.testResult={status:'failed',error:String(error)};document.querySelector('#result').textContent=error.stack;}
</script>
